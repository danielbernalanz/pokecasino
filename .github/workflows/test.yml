name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Comprobar sintaxis del cliente
        run: for f in public/js/*.js public/js/views/*.js public/sw.js; do node --check --input-type=module < "$f" || exit 1; done
      - run: npm test
