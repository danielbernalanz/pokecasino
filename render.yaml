# Blueprint de Render: despliega con un clic desde el panel (New → Blueprint).
# El plan gratuito no tiene disco: los datos se guardan en Postgres (DATABASE_URL).
services:
  - type: web
    name: pokecasino
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NETWORK_MODE
        value: any
      - key: TRUST_PROXY
        value: "1"
      - key: ACCESS_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: pokecasino-db
          property: connectionString

databases:
  - name: pokecasino-db
    plan: free
    region: frankfurt
